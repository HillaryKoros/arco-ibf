# ═══════════════════════════════════════════════════════════════════════════════
# E4DRR CRMA — Docker Compose Stack
# ═══════════════════════════════════════════════════════════════════════════════
#
# 6 services:
#   nginx    — Reverse proxy (single entry point, port 9080)
#   db       — PostGIS database (shared by CMS + GeoAPI)
#   cms      — Django/Wagtail CMS (content management + REST API)
#   geoapi   — FastAPI + TiPG (OGC vector tiles, features, custom geo endpoints)
#   titiler  — Titiler (COG raster tile server — placeholder)
#   frontend — Next.js (SSR dashboard)
#
# Quick start:
#   cp .env.example .env
#   docker compose up -d
#   open http://localhost:9080
#
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── 1. Nginx Reverse Proxy ──────────────────────────────────────────────────
  # Single entry point for all traffic. Routes:
  #   /          → frontend (Next.js)
  #   /api/      → cms (Wagtail REST API)
  #   /admin/    → cms (Wagtail admin)
  #   /geo/      → geoapi (TiPG + custom endpoints)
  #   /cog/      → titiler (raster tiles)
  nginx:
    image: nginx:1.27-alpine
    container_name: crma-nginx
    restart: unless-stopped
    ports:
      - "${CRMA_PORT:-9080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - frontend
      - cms
      - geoapi

  # ── 2. PostGIS Database ─────────────────────────────────────────────────────
  # Shared by CMS (Django ORM) and GeoAPI (TiPG + asyncpg).
  # On first start: runs db-init/ scripts to create tables, load GADM
  # admin boundaries (admin0/1/2), and seed EM-DAT disaster events.
  db:
    image: postgis/postgis:16-3.4
    container_name: crma-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: e4drr
      POSTGRES_USER: e4drr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-e4drr_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e4drr"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── 3. Wagtail CMS ─────────────────────────────────────────────────────────
  # Django/Wagtail for content management: storyline pages, hazard narratives,
  # media uploads. Exposes REST API at /api/v2/ for the frontend.
  cms:
    image: crma-cms:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crma-cms
    restart: unless-stopped
    environment:
      DB_ENGINE: django.contrib.gis.db.backends.postgis
      DB_NAME: e4drr
      DB_USER: e4drr
      DB_PASSWORD: ${DB_PASSWORD:-e4drr_dev}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-disasterevents_cms.settings.dev}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

  # ── 4. GeoAPI (FastAPI + TiPG) ─────────────────────────────────────────────
  # Custom FastAPI wrapper embedding TiPG's OGC router.
  #   - OGC endpoints (TiPG):  /collections/* — vector tiles + features
  #   - Custom endpoints:      /api/*         — calendar, choropleth, bbox, events
  geoapi:
    image: crma-geoapi:latest
    build:
      context: ./geoapi
      dockerfile: Dockerfile
    container_name: crma-geoapi
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DBNAME: e4drr
      POSTGRES_USER: e4drr
      POSTGRES_PASS: ${DB_PASSWORD:-e4drr_dev}
      TIPG_DB_SCHEMAS: '["public"]'
      ROOT_PATH: /geo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 5. Titiler (Raster Tile Server) ────────────────────────────────────────
  # Serves COGs as dynamic raster tiles. Placeholder — integrate later.
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: crma-titiler
    restart: unless-stopped
    environment:
      TITILER_API_CORS_ORIGINS: '["*"]'
      TITILER_API_ROOT_PATH: /cog

  # ── 6. Next.js Frontend ────────────────────────────────────────────────────
  # SSR dashboard: CRMA compare maps, calendar heatmaps, storylines.
  # Next.js rewrites proxy to backend services (used in dev; nginx handles in prod).
  frontend:
    image: crma-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crma-frontend
    restart: unless-stopped
    environment:
      CMS_API_URL: http://cms:8000
      GEO_API_URL: http://geoapi:8080
      TITILER_API_URL: http://titiler:80
    depends_on:
      - cms
      - geoapi

volumes:
  pgdata:
  media:

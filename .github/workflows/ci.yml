# ═══════════════════════════════════════════════════════════════════════════════
# E4DRR CRMA — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - Push to crma-deployed → build + check + deploy to staging
#   - Pull request           → build + check only
#
# Staging: 41.139.151.242 (hkoros) via SSH
# Entry point: nginx on port 9080
# ═══════════════════════════════════════════════════════════════════════════════

name: CRMA CI/CD

on:
  push:
    branches: [crma-deployed]
  pull_request:
    branches: [crma-deployed]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ── Build & Push Images ────────────────────────────────────────────────────
  build:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CMS image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crma-cms:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crma-cms:${{ github.sha }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      - name: Build GeoAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./geoapi
          file: ./geoapi/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crma-geoapi:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crma-geoapi:${{ github.sha }}
          cache-from: type=gha,scope=geoapi
          cache-to: type=gha,mode=max,scope=geoapi

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crma-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/crma-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Lint & Type Check ─────────────────────────────────────────────────────
  check:
    name: Lint & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Deploy to Staging ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, check]
    if: github.ref == 'refs/heads/crma-deployed' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            APP_DIR=${{ vars.STAGING_APP_DIR || '~/crma' }}

            # Clone or pull
            if [ ! -d "$APP_DIR" ]; then
              git clone -b crma-deployed https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin crma-deployed
            git checkout crma-deployed
            git reset --hard origin/crma-deployed

            # Login to GHCR and pull images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull cms geoapi frontend 2>/dev/null || true

            # Ensure .env exists
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Build and start (builds locally if pull fails)
            docker compose up -d --build --remove-orphans

            # Wait and verify
            sleep 15
            docker compose ps
            curl -sf http://localhost:9080/nginx-health || echo "WARNING: nginx health check failed"
            echo "=== CRMA staging deploy complete ==="

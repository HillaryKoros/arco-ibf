worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_comp_level 6;

    # Cache for vector tiles
    proxy_cache_path /tmp/nginx_tile_cache
        levels=1:2
        keys_zone=crma_tile_cache:10m
        max_size=256m
        inactive=10m
        use_temp_path=off;

    # Resolve Docker DNS
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;

        # ── Frontend (Next.js) — default route ──
        location / {
            proxy_pass http://frontend:3000;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Next.js static assets
        location /_next/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $http_host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Wagtail CMS API ──
        location /api/ {
            proxy_pass http://cms:8000;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Wagtail admin
        location /admin/ {
            proxy_pass http://cms:8000;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CMS static files
        location /static/ {
            proxy_pass http://cms:8000;
            proxy_set_header Host $http_host;
            add_header Cache-Control "public, max-age=86400";
        }

        # CMS media files
        location /media/ {
            proxy_pass http://cms:8000;
            proxy_set_header Host $http_host;
            add_header Access-Control-Allow-Origin *;
        }

        # ── GeoAPI (TiPG + custom endpoints) ──
        # OGC Features/Tiles + custom domain endpoints
        location /geo/ {
            rewrite ^/geo/(.*)$ /$1 break;
            proxy_pass http://geoapi:8080;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

            # Cache vector tiles
            proxy_cache crma_tile_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 60s;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ── Titiler (COG raster tiles) ──
        location /cog/ {
            rewrite ^/cog/(.*)$ /$1 break;
            proxy_pass http://titiler:8080;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin * always;
        }

        # Health check
        location /nginx-health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}

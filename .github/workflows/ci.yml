# ═══════════════════════════════════════════════════════════════════════════════
# E4DRR CI/CD — Build, Check, Deploy to Staging
# ═══════════════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - Push to main    → build + check + deploy to staging
#   - Pull request    → build + check only
#
# Services built:
#   - cms       (Django/Wagtail)
#   - geoapi    (FastAPI + TiPG)
#   - frontend  (Next.js)
#
# Deploy uses docker compose on the staging server via SSH.
# ═══════════════════════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ── Build & Check ──────────────────────────────────────────────────────────
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── CMS (Django/Wagtail) ──
      - name: Build CMS image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cms:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/cms:${{ github.sha }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      # ── GeoAPI (FastAPI + TiPG) ──
      - name: Build GeoAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./geoapi
          file: ./geoapi/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/geoapi:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/geoapi:${{ github.sha }}
          cache-from: type=gha,scope=geoapi
          cache-to: type=gha,mode=max,scope=geoapi

      # ── Frontend (Next.js) ──
      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Lint & Test ────────────────────────────────────────────────────────────
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend checks ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: frontend

      # ── CMS checks ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CMS dependencies
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: disasterevents_cms.settings.dev
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"

  # ── Deploy to Staging ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ secrets.STAGING_APP_DIR || '/opt/e4drr' }}

            # Pull latest code
            git pull origin main

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull pre-built images
            docker compose pull cms geoapi frontend

            # Restart services (db stays up, only app containers restart)
            docker compose up -d --no-build

            # Verify health
            sleep 10
            docker compose ps
            echo "Staging deploy complete"

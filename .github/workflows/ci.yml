# ═══════════════════════════════════════════════════════════════════════════════
# E4DRR CRMA — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# Triggers:
#   - Push to crma-deployed → checksum + build + check + security + deploy
#   - Pull request           → checksum + build + check + security only
#
# Uses SHA256 checksums to skip image rebuilds when content hasn't changed.
# Tags: :latest, :v0.1.0, :2026-03-11, :sha-abc123f
# ═══════════════════════════════════════════════════════════════════════════════

name: CRMA CI/CD

on:
  push:
    branches: [crma-deployed]
  pull_request:
    branches: [crma-deployed]

env:
  REGISTRY: ghcr.io

jobs:

  # ── Compute checksums & decide what to rebuild ────────────────────────────
  checksums:
    name: Checksum Detection
    runs-on: ubuntu-latest
    outputs:
      cms_changed: ${{ steps.compare.outputs.cms_changed }}
      geoapi_changed: ${{ steps.compare.outputs.geoapi_changed }}
      frontend_changed: ${{ steps.compare.outputs.frontend_changed }}
      infra_changed: ${{ steps.compare.outputs.infra_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute current checksums
        id: hash
        run: |
          CMS_HASH=$(find Dockerfile requirements.txt disasterevents_cms/ events/ home/ search/ manage.py \
            -type f 2>/dev/null | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "cms=$CMS_HASH" >> $GITHUB_OUTPUT

          GEOAPI_HASH=$(find geoapi/ -type f 2>/dev/null | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "geoapi=$GEOAPI_HASH" >> $GITHUB_OUTPUT

          FRONTEND_HASH=$(find frontend/ -type f -not -path 'frontend/node_modules/*' -not -path 'frontend/.next/*' \
            2>/dev/null | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "frontend=$FRONTEND_HASH" >> $GITHUB_OUTPUT

          INFRA_HASH=$(find docker-compose.yml nginx/ db-init/ .github/workflows/ \
            -type f 2>/dev/null | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "infra=$INFRA_HASH" >> $GITHUB_OUTPUT

          echo "CMS=$CMS_HASH  GEOAPI=$GEOAPI_HASH  FRONTEND=$FRONTEND_HASH  INFRA=$INFRA_HASH"

      - name: Restore previous checksums
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .checksums
          key: crma-checksums-dummy
          restore-keys: crma-checksums-

      - name: Compare checksums
        id: compare
        run: |
          PREV_CMS="" PREV_GEOAPI="" PREV_FRONTEND="" PREV_INFRA=""
          if [ -f .checksums ]; then
            source .checksums
          fi

          if [ "$PREV_CMS" = "${{ steps.hash.outputs.cms }}" ]; then
            echo "cms_changed=false" >> $GITHUB_OUTPUT
            echo "CMS unchanged"
          else
            echo "cms_changed=true" >> $GITHUB_OUTPUT
            echo "CMS changed"
          fi

          if [ "$PREV_GEOAPI" = "${{ steps.hash.outputs.geoapi }}" ]; then
            echo "geoapi_changed=false" >> $GITHUB_OUTPUT
            echo "GeoAPI unchanged"
          else
            echo "geoapi_changed=true" >> $GITHUB_OUTPUT
            echo "GeoAPI changed"
          fi

          if [ "$PREV_FRONTEND" = "${{ steps.hash.outputs.frontend }}" ]; then
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
            echo "Frontend unchanged"
          else
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "Frontend changed"
          fi

          if [ "$PREV_INFRA" = "${{ steps.hash.outputs.infra }}" ]; then
            echo "infra_changed=false" >> $GITHUB_OUTPUT
            echo "Infra unchanged"
          else
            echo "infra_changed=true" >> $GITHUB_OUTPUT
            echo "Infra changed"
          fi

      - name: Save checksums
        if: github.event_name == 'push'
        run: |
          cat > .checksums << 'HASHEOF'
          PREV_CMS="${{ steps.hash.outputs.cms }}"
          PREV_GEOAPI="${{ steps.hash.outputs.geoapi }}"
          PREV_FRONTEND="${{ steps.hash.outputs.frontend }}"
          PREV_INFRA="${{ steps.hash.outputs.infra }}"
          HASHEOF

      - name: Update checksum cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .checksums
          key: crma-checksums-${{ github.sha }}

  # ── Build & Push Images (only changed) ─────────────────────────────────────
  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: checksums
    if: needs.checksums.outputs.cms_changed == 'true' || needs.checksums.outputs.geoapi_changed == 'true' || needs.checksums.outputs.frontend_changed == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          VERSION=$(cat VERSION | tr -d '[:space:]')
          DATE=$(date +%Y-%m-%d)
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)

          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

          echo "Tags: latest, v${VERSION}, ${DATE}, sha-${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CMS image
        if: needs.checksums.outputs.cms_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-cms:latest
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-cms:v${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-cms:${{ steps.tags.outputs.date }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-cms:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      - name: Build GeoAPI image
        if: needs.checksums.outputs.geoapi_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./geoapi
          file: ./geoapi/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-geoapi:latest
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-geoapi:v${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-geoapi:${{ steps.tags.outputs.date }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-geoapi:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=geoapi
          cache-to: type=gha,mode=max,scope=geoapi

      - name: Build Frontend image
        if: needs.checksums.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-frontend:v${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-frontend:${{ steps.tags.outputs.date }}
            ${{ env.REGISTRY }}/${{ steps.tags.outputs.owner }}/crma-frontend:sha-${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Lint & Type Check (only if frontend changed) ──────────────────────────
  check:
    name: Lint & Check
    runs-on: ubuntu-latest
    needs: checksums
    if: needs.checksums.outputs.frontend_changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Security Scanning ─────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: checksums
    if: needs.checksums.outputs.cms_changed == 'true' || needs.checksums.outputs.geoapi_changed == 'true' || needs.checksums.outputs.frontend_changed == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table

      - name: Setup Node.js
        if: needs.checksums.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        if: needs.checksums.outputs.frontend_changed == 'true'
        run: npm audit --audit-level=high || true
        working-directory: frontend

      - name: Setup Python
        if: needs.checksums.outputs.cms_changed == 'true' || needs.checksums.outputs.geoapi_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        if: needs.checksums.outputs.cms_changed == 'true' || needs.checksums.outputs.geoapi_changed == 'true'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true
          pip-audit -r geoapi/requirements.txt || true

  # ── Deploy to Staging ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [checksums, build, check, security]
    if: |
      always() &&
      github.ref == 'refs/heads/crma-deployed' &&
      github.event_name == 'push' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped')
    environment: staging

    steps:
      - name: Set deploy vars
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            APP_DIR=~/crma
            REGISTRY=ghcr.io
            OWNER=${{ env.OWNER }}

            # Clone or pull
            if [ ! -d "$APP_DIR" ]; then
              git clone -b crma-deployed https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin crma-deployed
            git checkout crma-deployed
            git reset --hard origin/crma-deployed

            # Ensure .env exists
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Pull pre-built images from GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${REGISTRY}/${OWNER}/crma-cms:latest || true
            docker pull ${REGISTRY}/${OWNER}/crma-geoapi:latest || true
            docker pull ${REGISTRY}/${OWNER}/crma-frontend:latest || true

            # Tag for docker compose
            docker tag ${REGISTRY}/${OWNER}/crma-cms:latest crma-cms:latest 2>/dev/null || true
            docker tag ${REGISTRY}/${OWNER}/crma-geoapi:latest crma-geoapi:latest 2>/dev/null || true
            docker tag ${REGISTRY}/${OWNER}/crma-frontend:latest crma-frontend:latest 2>/dev/null || true

            # Start/update services
            docker compose up -d --remove-orphans

            # Verify
            sleep 10
            docker compose ps
            curl -sf http://localhost:9080/nginx-health || echo "WARNING: nginx health check failed"
            echo "=== CRMA staging deploy complete ==="
